site:
  title: Neo4j Developer Portal
  url: /developer

content:
  sources:
  - url: https://github.com/neo4j-documentation/labs-pages.git
    branches: publish

output:
  dir: ./build/site/

ui:
  bundle:
    url: https://d12wh7zj8x3amw.cloudfront.net/build/ui-bundle-latest.zip
    snapshot: true
  supplemental_files:
    - path: partials/article.hbs
      contents: |
        <div id="skip-to-content"></div>
        <article class="doc"{{#with page.attributes.product}} data-product="{{this}}"{{/with}}>
        {{#if (eq page.layout '404')}}
        <h1 class="page">{{{or page.title 'Page Not Found'}}}</h1>
        <div class="paragraph">
        <p>The page you&#8217;re looking for does not exist. It may have been moved.</p>
        </div>
        <div class="paragraph">
        <p>If you arrived on this page by clicking on a link, please notify the owner of the site that the link is broken.
        If you typed the URL of this page manually, please double check that you entered the address correctly.</p>
        </div>
        {{else}}
        <div class="sect-header">
          <h1 class="page{{#with (or page.attributes.role page.role) }}{{#each (split-string this ' ')}} label--{{{this}}}{{/each}}{{/with}}">{{{ page.title }}}</h1>
        </div>

        {{#with (or page.attributes.labels page.labels)}}
        <div class="paragraph labels">
          {{#each (split-string this ' ')}}
            <span class="label label--{{{this}}}">{{{this}}}</span>
          {{/each}}
        </div>
        {{/with}}

        {{!-- <span class="{{#with asciidoc.attributes.role}} {{{this}}}{{/with}}"></span> --}}


        {{#unless (eq page.layout 'landing')}}
        <div class="admonitionblock note labs-disclaimer">
        <table>
        <tbody><tr>
        <td class="icon">
        <i class="fa icon-note" title="Note"></i>
        </td>
        <td class="content">
        Documentation for a Neo4j Labs project, which is governed by these <a href="https://neo4j.com/labs#disclaimer" target="_blank" rel="noopener">terms</a>.
        </td>
        </tr>
        </tbody></table>
        </div>
        {{/unless}}

        {{#if page.attributes.deprecated-title}}
        <div class="admonitionblock caution">
        <table>
        <tbody><tr>
        <td class="icon">
        <i class="fa icon-caution" title="Caution"></i>
        </td>
        <td class="content">
        <div class="title">Important - page not maintained</div>
        <div class="paragraph">
          <p>
            This page is no longer being maintained and its content may be out of date.
            For the latest guidance, please visit
            <a href="{{{ page.attributes.deprecated-redirect }}}" class="noarrow" target="_blank">
              {{{ page.attributes.deprecated-title }}}
            </a>.
          </p>
        </div>
        </div>
        </td>
        </tr>
        </tbody></table>
        </div>
        {{/if}}

        {{{page.contents}}}
        {{#if (ne page.attributes.certificate undefined)}}
          <div id="_get_certificate" class="sect1 columns medium-12">
            <h2 id="_certificate"><a class="anchor" href="#_certificate"></a>Certificate</h2>
            <div class="download-certificate" data-status="ready">
              <div class="error">
                <p>
                  <strong>Certificate not available yet.</strong><br/>
                  Did you complete the quizzes at the end of each section?
                </p>
              </div>
              <div class="success">
                <p>
                  <strong>Congratulations on completing the course!</strong><br/>
                  Your certificate should automatically download. If it does not, <a href="#" data-action="download-certificate-link">click here</a>.
                </p>
              </div>
              <div class="spinner">
                <div class="double-bounce1"></div>
                <div class="double-bounce2"></div>
              </div>
              <div class="content">
                <a href="#" data-action="download-certificate" class="button button-download-certificate">Download certificate</a>
              </div>
            </div>
          </div>
        {{/if}}
        {{#if (ne page.attributes.quiz undefined)}}
          <div id="_grade_quiz_and_continue" class="sect1 columns medium-12">
            <div class="paragraph">
              <a data-action="grade-quiz" data-slug="{{page.attributes.slug}}" class="medium button secondary"><i class="fa fa-check"></i> Check Answers</a>
            </div>
          </div>
        {{/if}}
        {{/if}}
        {{> pagination}}
        {{> comments}}
        {{#if (eq page.layout 'training')}}
          {{> training-help}}
        {{/if}}
        </article>
    - path: partials/edit-this-page-link.hbs
      contents: |
        {{#unless page.attributes.origin-private}}
          {{#if (and page.fileUri (not env.CI))}}
            <div class="edit-this-page"><a href="{{page.fileUri}}">Edit this Page</a></div>
          {{else if page.attributes.page-edit-url}}
            <div class="edit-this-page"><a href="{{page.attributes.page-edit-url}}">Edit this Page</a></div>
          {{else if (and page.editUrl (or env.FORCE_SHOW_EDIT_PAGE_LINK (not page.origin.private)))}}
            <div class="edit-this-page"><a href="{{page.editUrl}}">Edit this Page</a></div>
          {{/if}}
        {{/unless}}

urls:
  html_extension_style: indexify

asciidoc:
  extensions:
  - ./extensions/remote-include/remote-include-processor
  - ./extensions/macros/macros
  attributes:
    experimental: ''
    page-cdn: /static/assets
    page-mixpanel: 4bfb2414ab973c741b6f067bf06d5575
    # page-ad-overline-link: https://sessionize.com/nodes-2025/
    # page-ad-overline: Nov 6 2025
    # page-ad-title: NODES 2025
    # page-ad-description: The Call for Papers is now open and we want to hear about your graph-related projects. Submit your talks by June 15
    # page-ad-link: https://sessionize.com/nodes-2025/
    # page-ad-underline-role: button
    # page-ad-underline: Submit your talk
